server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the Cloudflare tunnel nginx only sees http, so redirects stay
    # relative and the browser keeps https and the host it asked for.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # A copy of scripts/install.sh from the Tuni repo, for the short one-liner.
    # Plain text so a browser shows it instead of downloading it, and never
    # cached, so a new copy reaches the next person to run it.
    location = /install.sh {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite names these by content hash, so a changed file is a new URL.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The fonts never change under the same name; a new cut gets a new file.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
